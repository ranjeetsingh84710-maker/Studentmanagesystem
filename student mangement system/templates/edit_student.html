
<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
    <style>
        body {
            font-family: Arial;
            background: #f0f4f8;
            padding: 30px;
        }
        .container {
            max-width: 450px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }
        h2 { color: #123B6D; }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }
        button {
            background: #123B6D;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Edit Student Details</h2>

        <form method="POST">
            <label>Student Name</label>
            <input type="text" name="name"
                   value="{{ student['name'] }}" required>

            <label>Email</label>
            <input type="email" name="email"
                   value="{{ student['email'] }}" required>

            <button type="submit">Update Student</button>
        </form>

        <a href="{{ url_for('admin') }}">Back to Admin Panel</a>
    </div>
</body>
</html>
