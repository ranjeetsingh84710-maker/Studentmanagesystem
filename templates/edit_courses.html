
<!DOCTYPE html>
<html>
<head>
    <title>Edit Course</title>
    <style>
        body {
            font-family: Arial;
            background: #f0f4f8;
            padding: 30px;
        }
        .container {
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }
        h2 { color: #123B6D; }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }
        button {
            background: #123B6D;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>✏️ Edit Course</h2>

    <form method="POST">
        <input type="text" name="course_name"
               value="{{ course['course_name'] }}" required>

        <input type="text" name="course_code"
               value="{{ course['course_code'] }}" required>

        <input type="text" name="department"
               value="{{ course['department'] }}" required>

        <input type="text" name="duration"
               value="{{ course['duration'] }}" required>

        <button type="submit">Update Course</button>
    </form>

    <a href="{{ url_for('courses') }}">Back to Courses</a>
</div>
</body>
</html>
