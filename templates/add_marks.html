
<!DOCTYPE html>
<html>
<head>
    <title>Add Student Marks</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            padding: 30px;
        }
        .container {
            max-width: 450px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #ccc;
        }
        h2 {
            text-align: center;
            color: #123B6D;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }
        button {
            background: #123B6D;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Add Student Marks</h2>

        <form method="POST">
            <input type="text" name="subject"
                   placeholder="Subject Name" required>

            <input type="number" name="total_marks"
                   placeholder="Total Marks" min="1" required>

            <input type="number" name="obtained_marks"
                   placeholder="Obtained Marks" min="0" required>

            <button type="submit">Save Marks</button>
        </form>

        <p><a href="{{ url_for('marks') }}">Back to Results</a></p>
    </div>
</body>
</html>
