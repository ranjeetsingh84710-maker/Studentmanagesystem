
<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <style>
        body {
            font-family: Arial;
            background: #f0f4f8;
            padding: 25px;
        }
        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }
        h2 { color: #123B6D; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background: #123B6D;
            color: white;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>🎓 Admin Panel - Student Management</h2>
    <h3>Total Students: {{ students|length }}</h3>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Roll Number</th>
            <th>Email</th>
            <th>Action</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student['id'] }}</td>
            <td>{{ student['name'] }}</td>
            <td>{{ student['roll_number'] }}</td>
            <td>{{ student['email'] }}</td>
            <td>
    <a href="{{ url_for('edit_student', student_id=student['id']) }}">
        <button type="button">Edit</button>
    </a>

    <form method="POST"
          action="{{ url_for('delete_student', student_id=student['id']) }}"
          onsubmit="return confirm('Are you sure you want to delete this student?');">
        <button type="submit">Delete</button>
    </form>
</td>
        </tr>
        {% endfor %}
    </table>

    <p><a href="{{ url_for('dashboard') }}">Back to Dashboard</a></p>
</div>
</body>
</html>
